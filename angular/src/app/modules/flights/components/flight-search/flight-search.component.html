<div>  
  <h2>Buscar Vuelos</h2>
  <form (ngSubmit)="onSearchButtonClick()" class="search-form">
    <!-- Origen -->
    <mat-form-field>
      <mat-label>Origen</mat-label>
      <mat-select [(ngModel)]="selectedOrigin" [ngModelOptions]="{standalone: true}">
          @for (location of locations; track location) {
            <mat-option [value]="location">{{ location }}</mat-option>
          }
      </mat-select>
  </mat-form-field> 
  
    <!-- Destino -->
    <mat-form-field>
      <mat-label>Destino</mat-label>
      <mat-select [(ngModel)]="selectedDestination" [ngModelOptions]="{standalone: true}">
          @for (location of locations; track location) {
            <mat-option [value]="location">{{ location }}</mat-option>
          }
      </mat-select>
  </mat-form-field> 
  
    <!-- Fechas -->
    <mat-form-field class="date-picker">
      <mat-label>Fechas</mat-label>
      <mat-date-range-input [rangePicker]="picker" [min]="datePickerMinStart">
          <input matStartDate placeholder="Fecha inicio" [formControl]="datePickerStart">
          <input matEndDate placeholder="Fecha fin" [formControl]="datePickerEnd">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>
  
    <!-- Botón de búsqueda -->
    <button mat-raised-button color="primary" type="submit">Buscar</button>

    <!-- Botón de reinicio -->
    <button mat-raised-button color="secondary" (click)="onResetButtonClick()">Limpiar filtros</button>
  </form>
</div>
